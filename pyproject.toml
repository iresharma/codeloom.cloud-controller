[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codeloom-cloud"
version = "0.1.0"
description = "Cloud controller for codeloom.engine sandboxes"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=43",
  "docker>=7",
  "fastapi>=0.115",
  "httpx>=0.27",
  "pydantic-settings>=2.6",
  "pyjwt>=2.9",
  "sqlalchemy>=2.0",
  "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
]

[project.scripts]
codeloom-cloud = "codeloom_cloud.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src", "."]
